<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Frisk OnePiece Challenge</title>
  <style>
    :root{
      --bg: #0b1220;
      --surface: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.16);
      --text: #eaf0ff;
      --muted: rgba(234,240,255,.72);
      --radius: 20px;
    }

    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }

    body{
      margin: 18px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 400px at 10% 0%, rgba(124,58,237,.28), transparent 55%),
        radial-gradient(800px 420px at 92% 8%, rgba(6,182,212,.22), transparent 55%),
        radial-gradient(700px 520px at 40% 110%, rgba(124,58,237,.16), transparent 60%),
        var(--bg);
      min-height: 100vh;
    }

    h1{
      margin: 0 0 12px;
      font-size: 32px;
      letter-spacing: -0.02em;
    }

    .pick{
      top: 10px;
      z-index: 10;

      display:flex;
      align-items:center;
      gap: 10px;
      margin: 4px 0 16px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      backdrop-filter: blur(10px);
    }

    .btn{
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.2);
      cursor: pointer;
      color: var(--text);
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      white-space: nowrap;
      font-size: 14px;
    }
    .btn:active{ transform: translateY(1px); }

    .hint{ color: var(--muted); font-size: 13px; }

    /* ✅ Mobile-first : 1 carte par écran, sans gros vide */
    .row{
      display:flex;
      flex-direction: column;
      gap: 28px;
      scroll-snap-type: y mandatory;
      padding-bottom: 32px;
    }

    .card{
      width: 100%;
      height: calc(100vh - 150px);   /* carte ≈ plein écran */
      padding: 14px 12px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--surface), rgba(255,255,255,.03));
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(0,0,0,.45);

      display:flex;
      flex-direction: column;

      scroll-snap-align: start;
      scroll-margin-top: 12px;
    }

    .card h2{
      margin: 2px 4px 10px;
      font-size: 22px;
      letter-spacing: -0.01em;
    }

    /* Conteneur de l’image : plus de bordure entre le titre et l’image */
    .media{
      flex: 1;
      min-height: 0;
      margin-top: 4px;

      border-radius: 18px;
      overflow: hidden;
      background: #ffffff;
      /* PAS de border ici -> bye la ligne en trop */
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0;
    }

    /* L’image/canvas remplit la carte verticalement */
    canvas, img{
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;        /* prend la hauteur dispo → moins de vide */
      display:block;
      background: #ffffff;
      border-radius: 0;
    }

    canvas{
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #file{ display:none; }
  </style>
</head>
<body>
  <h1>Frisk OnePiece Challenge</h1>

  <div class="pick">
    <button class="btn" id="pickBtn" type="button">Choisir une image</button>
    <span class="hint" id="status">Aucune image sélectionnée</span>
    <input id="file" type="file" accept="image/*" />
  </div>

  <div class="row">
    <div class="card">
      <h2>Hard</h2>
      <div class="media"><canvas id="outBig"></canvas></div>
    </div>

    <div class="card">
      <h2>Mid</h2>
      <div class="media"><canvas id="outMid"></canvas></div>
    </div>

    <div class="card">
      <h2>Easy</h2>
      <div class="media"><canvas id="outEasy"></canvas></div>
    </div>

    <div class="card">
      <h2>Original</h2>
      <div class="media"><img id="preview" alt="Aperçu original" /></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("file");
    const pickBtn = document.getElementById("pickBtn");
    const statusEl = document.getElementById("status");

    const preview = document.getElementById("preview");
    const outBig = document.getElementById("outBig");
    const outMid = document.getElementById("outMid");
    const outEasy = document.getElementById("outEasy");

    const HARD_PIXEL_SIZE = 200;
    const MID_PIXEL_SIZE  = 100;
    const EASY_PIXEL_SIZE = 65;

    pickBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (!file) return;

      statusEl.textContent = "Image chargée ✅";

      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;

        preview.src = dataUrl;

        const img = new Image();
        img.onload = () => {
          pixelateToCanvas(img, outBig, HARD_PIXEL_SIZE);
          pixelateToCanvas(img, outMid, MID_PIXEL_SIZE);
          pixelateToCanvas(img, outEasy, EASY_PIXEL_SIZE);
        };
        img.onerror = () => {
          statusEl.textContent = "Erreur de chargement ❌";
        };
        img.src = dataUrl;
      };
      reader.onerror = () => {
        statusEl.textContent = "Erreur de lecture ❌";
      };
      reader.readAsDataURL(file);
    });

    function pixelateToCanvas(img, canvas, pixelSize) {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (!w || !h) return;

      canvas.width = w;
      canvas.height = h;

      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      const smallW = Math.max(1, Math.floor(w / pixelSize));
      const smallH = Math.max(1, Math.floor(h / pixelSize));

      const tmp = document.createElement("canvas");
      tmp.width = smallW;
      tmp.height = smallH;

      const tctx = tmp.getContext("2d");
      tctx.imageSmoothingEnabled = false;

      tctx.clearRect(0, 0, smallW, smallH);
      tctx.drawImage(img, 0, 0, smallW, smallH);

      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(tmp, 0, 0, smallW, smallH, 0, 0, w, h);
    }
  </script>
</body>
</html>
