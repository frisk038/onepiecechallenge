<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Frisk OPC Challenge</title>
  <style>
    :root{
      --bg: #0b1220;
      --surface: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.14);
      --text: #eaf0ff;
      --muted: rgba(234,240,255,.72);
      --accent: #7c3aed;
      --accent-2: #06b6d4;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(900px 400px at 10% 0%, rgba(124,58,237,.28), transparent 55%),
        radial-gradient(800px 420px at 92% 8%, rgba(6,182,212,.22), transparent 55%),
        radial-gradient(700px 520px at 40% 110%, rgba(124,58,237,.16), transparent 60%),
        var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 34px;
      letter-spacing: -0.02em;
    }

    .pick {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 24px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .btn {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      cursor: pointer;
      color: var(--text);
      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(6,182,212,.85));
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      transition: transform .12s ease, filter .12s ease;
      font-size: 15px;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn:active { transform: translateY(0px); filter: brightness(.98); }

    /* Single card + nav */
    .stage {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card {
      width: 360px;
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--surface), rgba(255,255,255,.03));
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 12px;
    }

    .card h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.01em;
    }

    .step-label {
      font-size: 13px;
      color: var(--muted);
    }

    .media {
      border-radius: calc(var(--radius) - 6px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
    }

    canvas, img {
      width: 100%;
      height: auto;
      display: block;
      background: transparent;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .arrow-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(124,58,237,.7), rgba(6,182,212,.6));
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
      transition: transform .12s ease, filter .12s ease;
      flex-shrink: 0;
    }
    .arrow-btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .arrow-btn:active { transform: translateY(0); filter: brightness(.95); }
    .arrow-btn:disabled { opacity: .3; cursor: default; pointer-events: none; }

    @media (max-width: 520px) {
      .card { width: calc(100vw - 96px - 32px); }
    }
  </style>
</head>
<body>
  <h1>Frisk OnePiece Challenge</h1>

  <div class="pick">
    <button class="btn" id="pickBtn" type="button">Nouvelle image</button>
  </div>

  <div class="stage">
    <button class="arrow-btn" id="prevBtn" disabled title="Précédent">&#8592;</button>

    <div class="card">
      <div class="card-header">
        <h2 id="levelTitle">Hard</h2>
        <span class="step-label" id="stepLabel">1 / 4</span>
      </div>
      <div class="media">
        <canvas id="outBig"></canvas>
        <canvas id="outMid" style="display:none"></canvas>
        <canvas id="outEasy" style="display:none"></canvas>
        <img id="preview" alt="Aperçu original" style="display:none" />
      </div>
    </div>

    <button class="arrow-btn" id="nextBtn" title="Niveau suivant">&#8594;</button>
  </div>

  <script>
    const IMAGES = [
      "ace","aokiji","arlong","bb","bn","boa","bonclay","borsalino",
      "brook","croco","dofla","ener","franky","katakuri","kid","kuma",
      "luffy","marco","mihawk","mom","nami","oden","perona","rayleigh",
      "robin","robluci","roger","sabo","sakazuki","sanji","shanks",
      "smoker","vega","vivi","yamato"
    ];

    const LEVELS = [
      { title: "Hard",     el: () => outBig   },
      { title: "Mid",      el: () => outMid   },
      { title: "Easy",     el: () => outEasy  },
      { title: "Original", el: () => preview  },
    ];

    const pickBtn   = document.getElementById("pickBtn");

    const prevBtn   = document.getElementById("prevBtn");
    const nextBtn   = document.getElementById("nextBtn");
    const levelTitle = document.getElementById("levelTitle");
    const stepLabel  = document.getElementById("stepLabel");

    const outBig  = document.getElementById("outBig");
    const outMid  = document.getElementById("outMid");
    const outEasy = document.getElementById("outEasy");
    const preview = document.getElementById("preview");

    const HARD_PIXEL_SIZE = 200;
    const MID_PIXEL_SIZE  = 100;
    const EASY_PIXEL_SIZE = 65;

    let lastPick = null;
    let currentLevel = 0;

    function pickRandom() {
      let pick;
      do { pick = IMAGES[Math.floor(Math.random() * IMAGES.length)]; }
      while (pick === lastPick && IMAGES.length > 1);
      lastPick = pick;
      return pick;
    }

    function showLevel(index) {
      currentLevel = index;
      LEVELS.forEach((l, i) => { l.el().style.display = i === index ? "block" : "none"; });
      levelTitle.textContent = LEVELS[index].title;
      stepLabel.textContent  = (index + 1) + " / " + LEVELS.length;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === LEVELS.length - 1;
    }

    function loadImage(name) {
      currentLevel = 0;
      const img = new Image();
      img.onload = () => {
        preview.src = img.src;
        pixelateToCanvas(img, outBig,  HARD_PIXEL_SIZE);
        pixelateToCanvas(img, outMid,  MID_PIXEL_SIZE);
        pixelateToCanvas(img, outEasy, EASY_PIXEL_SIZE);
        showLevel(0);
      };
      img.onerror = () => {};
      img.src = "data/" + name + ".JPG";
    }

    pickBtn.addEventListener("click", () => loadImage(pickRandom()));
    prevBtn.addEventListener("click", () => showLevel(currentLevel - 1));
    nextBtn.addEventListener("click", () => showLevel(currentLevel + 1));

    loadImage(pickRandom());

    function pixelateToCanvas(img, canvas, pixelSize) {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (!w || !h) return;
      canvas.width  = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      const smallW = Math.max(1, Math.floor(w / pixelSize));
      const smallH = Math.max(1, Math.floor(h / pixelSize));
      const tmp  = document.createElement("canvas");
      tmp.width  = smallW;
      tmp.height = smallH;
      const tctx = tmp.getContext("2d");
      tctx.imageSmoothingEnabled = false;
      tctx.drawImage(img, 0, 0, smallW, smallH);
      ctx.drawImage(tmp, 0, 0, smallW, smallH, 0, 0, w, h);
    }
  </script>
</body>
</html>
