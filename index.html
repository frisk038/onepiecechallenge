<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Frisk OPC Challenge</title>
  <style>
    :root{
      /* Palette moderne (clair + accent) */
      --bg: #0b1220;
      --surface: rgba(255,255,255,.06);
      --surface-2: rgba(255,255,255,.10);
      --border: rgba(255,255,255,.14);
      --text: #eaf0ff;
      --muted: rgba(234,240,255,.72);
      --accent: #7c3aed;      /* violet */
      --accent-2: #06b6d4;    /* cyan */
      --shadow: 0 18px 50px rgba(0,0,0,.45);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 24px;
      color: var(--text);
      background:
        radial-gradient(900px 400px at 10% 0%, rgba(124,58,237,.28), transparent 55%),
        radial-gradient(800px 420px at 92% 8%, rgba(6,182,212,.22), transparent 55%),
        radial-gradient(700px 520px at 40% 110%, rgba(124,58,237,.16), transparent 60%),
        var(--bg);
      min-height: 100vh;
    }

    h1{
      margin: 0 0 14px;
      font-size: 34px;
      letter-spacing: -0.02em;
    }

    .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }

    .card {
      width: 360px;
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--surface), rgba(255,255,255,.03));
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .card h2{
      margin: 0 0 12px;
      font-size: 20px;
      letter-spacing: -0.01em;
    }

    .pick {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0 18px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .btn {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      cursor: pointer;
      color: var(--text);
      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(6,182,212,.85));
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn:active { transform: translateY(0px); filter: brightness(.98); }

    .hint { color: var(--muted); font-size: 14px; }

    /* Zone image/canvas */
    .media{
      border-radius: calc(var(--radius) - 6px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: transparent;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      background: transparent;
    }

    /* Add vertical air between cards (mobile-first) */
  @media (max-width: 768px) {
  .row {
    gap: 100px; /* more space between cards */
  }

  .card {
    margin-bottom: 12px; /* extra breathing room */
  }
}


  </style>
</head>
<body>
  <h1>Frisk OnePiece Challenge</h1>

  <div class="pick">
    <button class="btn" id="pickBtn" type="button">Nouvelle image</button>
    <span class="hint" id="status">Chargement…</span>
  </div>

  <div class="row">
    <div class="card">
      <h2>Hard</h2>
      <div class="media"><canvas id="outBig"></canvas></div>
    </div>

    <div class="card">
      <h2>Mid</h2>
      <div class="media"><canvas id="outMid"></canvas></div>
    </div>

    <div class="card">
      <h2>Easy</h2>
      <div class="media"><canvas id="outEasy"></canvas></div>
    </div>

    <!-- Original à la fin -->
    <div class="card">
      <h2>Original</h2>
      <div class="media"><img id="preview" alt="Aperçu original" /></div>
    </div>
  </div>

  <script>
    const IMAGES = [
      "ace","aokiji","arlong","bb","bn","boa","bonclay","borsalino",
      "brook","croco","dofla","ener","franky","katakuri","kid","kuma",
      "luffy","marco","mihawk","mom","nami","oden","perona","rayleigh",
      "robin","robluci","roger","sabo","sakazuki","sanji","shanks",
      "smoker","vega","vivi","yamato"
    ];

    const pickBtn  = document.getElementById("pickBtn");
    const statusEl = document.getElementById("status");
    const preview  = document.getElementById("preview");
    const outBig   = document.getElementById("outBig");
    const outMid   = document.getElementById("outMid");
    const outEasy  = document.getElementById("outEasy");

    const HARD_PIXEL_SIZE = 200;
    const MID_PIXEL_SIZE  = 100;
    const EASY_PIXEL_SIZE = 65;

    let lastPick = null;

    function pickRandom() {
      let pick;
      do { pick = IMAGES[Math.floor(Math.random() * IMAGES.length)]; }
      while (pick === lastPick && IMAGES.length > 1);
      lastPick = pick;
      return pick;
    }

    function loadImage(name) {
      statusEl.textContent = "Chargement…";
      const img = new Image();
      img.onload = () => {
        preview.src = img.src;
        pixelateToCanvas(img, outBig,  HARD_PIXEL_SIZE);
        pixelateToCanvas(img, outMid,  MID_PIXEL_SIZE);
        pixelateToCanvas(img, outEasy, EASY_PIXEL_SIZE);
        statusEl.textContent = "Image chargée ✅";
      };
      img.onerror = () => {
        statusEl.textContent = "Erreur de chargement ❌";
      };
      img.src = "data/" + name + ".JPG";
    }

    pickBtn.addEventListener("click", () => loadImage(pickRandom()));

    loadImage(pickRandom());

    function pixelateToCanvas(img, canvas, pixelSize) {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (!w || !h) return;

      canvas.width = w;
      canvas.height = h;

      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      const smallW = Math.max(1, Math.floor(w / pixelSize));
      const smallH = Math.max(1, Math.floor(h / pixelSize));

      const tmp = document.createElement("canvas");
      tmp.width = smallW;
      tmp.height = smallH;

      const tctx = tmp.getContext("2d");
      tctx.imageSmoothingEnabled = false;

      tctx.clearRect(0, 0, smallW, smallH);
      tctx.drawImage(img, 0, 0, smallW, smallH);

      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(tmp, 0, 0, smallW, smallH, 0, 0, w, h);
    }
  </script>
</body>
</html>
